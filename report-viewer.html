<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Report Viewer — IZAAN Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-darkest: #010104; --bg-dark: #020819; --bg-mid: #02133D;
            --accent-3: #0D6BE8; --accent-4: #2D8EFF;
            --text-white: #F6F6F6; --text-muted: #B6BBC1; --text-dim: #78797D;
            --glow-gradient: linear-gradient(90deg, #07339D, #0D4CC8, #0D6BE8, #2D8EFF, #63B5FF);
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Sora', sans-serif;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg-darkest); font-family: var(--font-primary); color: var(--text-white); line-height: 1.6; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        .gradient-text { background: var(--glow-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .page-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 20%, rgba(7, 51, 157, 0.12) 0%, transparent 60%);
        }

        /* Header */
        .viewer-header {
            position: sticky; top: 0; z-index: 100; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(1, 1, 4, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(13, 107, 232, 0.1);
        }
        .header-logo { font-family: var(--font-secondary); font-size: 1.5rem; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 15px rgba(13, 107, 232, 0.5); }
        .header-back { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); transition: color 0.3s; }
        .header-back:hover { color: var(--accent-4); }

        /* Report Info */
        .report-info {
            position: relative; z-index: 1; padding: 40px 40px 20px; max-width: 1000px; margin: 0 auto;
        }
        .report-title { font-family: var(--font-secondary); font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; margin-bottom: 10px; }
        .report-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
        .report-category { font-size: 0.65rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-4); background: rgba(13, 107, 232, 0.08); border: 1px solid rgba(13, 107, 232, 0.15); padding: 4px 12px; border-radius: 20px; }
        .report-date { font-size: 0.8rem; color: var(--text-dim); }
        .report-description { color: var(--text-muted); font-size: 0.95rem; max-width: 750px; margin-bottom: 10px; }

        /* PDF Scroll Viewport Outer Wrap */
        .pdf-viewer-outer {
            position: relative; z-index: 1; max-width: 950px; margin: 0 auto 60px; padding: 0 20px;
        }

        .pdf-toolbar {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
            background: rgba(2, 12, 35, 0.95); border: 1px solid rgba(13, 107, 232, 0.3); border-bottom: none;
            border-top-left-radius: 16px; border-top-right-radius: 16px; font-size: 0.8rem; color: var(--text-muted);
        }
        .pdf-toolbar .badge-info {
            background: rgba(13, 107, 232, 0.15); color: #63B5FF; border: 1px solid rgba(13, 107, 232, 0.3);
            padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
        }

        /* Scrollable PDF Viewport */
        .pdf-scroll-viewport {
            position: relative;
            width: 100%;
            height: 720px;
            overflow-y: auto;
            overflow-x: hidden;
            background: #030a1c;
            border: 1px solid rgba(13, 107, 232, 0.3);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(13, 107, 232, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 24px 16px 40px;
            scroll-behavior: smooth;
        }

        /* PDF Page Canvas Card */
        .pdf-canvas-wrap {
            position: relative; width: 100%; max-width: 820px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 8px; overflow: hidden; background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0;
        }
        .pdf-canvas-header {
            background: #070d1e; color: #78797D; font-size: 0.7rem; font-weight: 600;
            padding: 6px 16px; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between;
        }
        .pdf-canvas-wrap canvas {
            width: 100% !important; height: auto !important; display: block;
        }

        /* Page 3 Blurred styling */
        .pdf-canvas-wrap.page-locked canvas {
            filter: blur(8px); opacity: 0.4; user-select: none; pointer-events: none;
        }

        /* Popup Overlay ON TOP of PDF Scroller */
        .pdf-gate-popup-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(1, 5, 20, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 16px;
        }

        .pdf-gate-popup-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .pdf-gate-popup-card {
            background: linear-gradient(135deg, rgba(2, 10, 30, 0.98), rgba(2, 24, 75, 0.98));
            border: 1px solid rgba(13, 107, 232, 0.5);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 35px rgba(13, 107, 232, 0.35);
            padding: 40px 32px;
            text-align: center;
            max-width: 580px;
            width: 100%;
            transform: scale(0.92) translateY(20px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pdf-gate-popup-overlay.active .pdf-gate-popup-card {
            transform: scale(1) translateY(0);
        }

        .popup-gate-icon {
            width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 50%;
            background: rgba(13, 107, 232, 0.15); border: 1px solid rgba(13, 107, 232, 0.4);
            display: grid; place-items: center; color: var(--accent-4);
            box-shadow: 0 0 20px rgba(13, 107, 232, 0.3);
        }

        .pdf-gate-popup-card h3 {
            font-family: var(--font-secondary); font-size: 1.45rem; font-weight: 800; margin-bottom: 12px;
        }
        .pdf-gate-popup-card p {
            color: var(--text-muted); font-size: 0.95rem; max-width: 500px; margin: 0 auto 24px; line-height: 1.7;
        }

        .pdf-gate-popup-card .schedule-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 38px; border-radius: 50px; font-size: 0.85rem; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase; background: var(--glow-gradient);
            color: var(--text-white); border: none; cursor: pointer; transition: all 0.3s;
            font-family: var(--font-primary); box-shadow: 0 4px 20px rgba(13, 107, 232, 0.5);
            text-decoration: none;
        }
        .pdf-gate-popup-card .schedule-btn:hover {
            transform: translateY(-3px); box-shadow: 0 10px 30px rgba(13, 107, 232, 0.7);
        }

        /* Watermark */
        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg);
            font-family: var(--font-secondary); font-size: 5rem; font-weight: 800;
            color: rgba(13, 107, 232, 0.04); letter-spacing: 20px;
            white-space: nowrap; pointer-events: none; z-index: 50;
        }

        /* Footer */
        .viewer-footer { text-align: center; padding: 30px; border-top: 1px solid rgba(13, 107, 232, 0.06); position: relative; z-index: 1; }
        .viewer-footer p { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; }

        /* No report state */
        .no-report {
            text-align: center; padding: 120px 40px; position: relative; z-index: 1;
        }
        .no-report h2 { font-family: var(--font-secondary); font-size: 1.8rem; margin-bottom: 12px; }
        .no-report p { color: var(--text-muted); margin-bottom: 24px; }
        .back-btn {
            display: inline-flex; padding: 12px 28px; border-radius: 50px;
            font-size: 0.8rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--accent-4); border: 1px solid rgba(13, 107, 232, 0.3); transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(13, 107, 232, 0.1); transform: translateY(-2px); }

        @media (max-width: 768px) {
            .viewer-header { padding: 15px 20px; }
            .report-info { padding: 24px; }
            .pdf-viewer-outer { padding: 0 12px; }
            .pdf-scroll-viewport { height: 600px; padding: 16px 8px; }
            .pdf-gate-popup-card { padding: 30px 20px; }
            .watermark { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="watermark" aria-hidden="true">PREVIEW COPY</div>

    <header class="viewer-header">
        <a href="/" class="header-logo">IZAAN</a>
        <a href="/reports.html" class="header-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Back to Reports
        </a>
    </header>

    <div id="report-content">
        <!-- Loaded dynamically -->
    </div>

    <footer class="viewer-footer">
        <p>&copy; 2026 Izaan. All rights reserved. This is a preview copy for evaluation purposes.</p>
    </footer>

    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search); 
            var reportId = urlParams.get('id') || 
            window.location.pathname.split('/').pop();

            if (!reportId || reportId === 'reports') {
                showNoReport();
                return;
            }

            function loadReport() {
                var db = window.firebaseDB;
                var h = window.firebaseHelpers;
                h.getDoc(h.doc(db, 'reports', reportId))
                    .then(function(docSnap) {
                        if (!docSnap.exists()) {
                            showNoReport();
                            return;
                        }
                        var report = docSnap.data();
                        report.id = docSnap.id;
                        if (!report.published) { showNoReport(); return; }
                        renderReport(report);
                    })
                    .catch(function() {
                        showNoReport();
                    });
            }
            if (window.firebaseReady) { loadReport(); }
            else { window.addEventListener('firebase-ready', loadReport); }

            function renderReport(r) {
                var dateStr = r.report_date ? new Date(r.report_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                var tags = (r.tags || '').split(',').filter(Boolean);
                var tagsHtml = tags.map(function(t) { return '<span class="report-category">' + t.trim() + '</span>'; }).join(' ');

                var html = '<div class="report-info">' +
                    '<h1 class="report-title"><span class="gradient-text">' + r.title + '</span></h1>' +
                    '<div class="report-meta">' + tagsHtml + (dateStr ? '<span class="report-date">' + dateStr + '</span>' : '') + '</div>' +
                    '<p class="report-description">' + r.description + '</p>' +
                '</div>';

                html += '<div class="pdf-viewer-outer">' +
                    '<div class="pdf-toolbar">' +
                        '<span>📄 Report Preview Viewer</span>' +
                        '<span id="page-count-badge" class="badge-info">Loading Document...</span>' +
                    '</div>' +
                    '<div style="position: relative; overflow: hidden; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">' +
                        '<div id="pdf-viewport" class="pdf-scroll-viewport">' +
                            '<div style="padding: 40px; color: var(--text-dim); font-size: 0.9rem;">Loading report pages...</div>' +
                        '</div>' +
                        '<div id="popup-overlay" class="pdf-gate-popup-overlay">' +
                            '<div class="pdf-gate-popup-card">' +
                                '<div class="popup-gate-icon">' +
                                    '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>' +
                                '</div>' +
                                '<h3><span class="gradient-text">Full Report Available During Meeting</span></h3>' +
                                '<p>The complete report with all pages, detailed analysis, and raw data will be shared during our online meeting. Schedule a call to see the full report and discuss the methodology.</p>' +
                                '<a href="/#contact" class="schedule-btn">Schedule a Meeting</a>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';

                document.getElementById('report-content').innerHTML = html;

                if (r.pdf_path) {
                    loadPdfPages(r);
                } else {
                    renderNoPdfState();
                }
            }

            function loadPdfPages(r) {
                var viewport = document.getElementById('pdf-viewport');
                var popupOverlay = document.getElementById('popup-overlay');
                var pageBadge = document.getElementById('page-count-badge');
                if (!viewport) return;

                if (window.pdfjsLib) {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                    pdfjsLib.getDocument(r.pdf_path).promise.then(function(pdf) {
                        viewport.innerHTML = ''; // clear loading state
                        if (pageBadge) {
                            pageBadge.textContent = 'Pages 1–2 of ' + pdf.numPages + ' Available in Preview';
                        }

                        // Render up to 3 pages (Page 1 clean, Page 2 clean, Page 3 blurred boundary)
                        var pagesToRender = Math.min(pdf.numPages, 3);
                        var renderSequence = Promise.resolve();

                        for (var i = 1; i <= pagesToRender; i++) {
                            (function(pageNum) {
                                renderSequence = renderSequence.then(function() {
                                    return pdf.getPage(pageNum).then(function(page) {
                                        var viewportScale = page.getViewport({ scale: 1.35 });
                                        var wrap = document.createElement('div');
                                        wrap.className = 'pdf-canvas-wrap' + (pageNum >= 3 ? ' page-locked' : '');
                                        if (pageNum === 3) {
                                            wrap.id = 'pdf-page-3';
                                        }

                                        var header = document.createElement('div');
                                        header.className = 'pdf-canvas-header';
                                        header.innerHTML = '<span>Page ' + pageNum + ' of ' + pdf.numPages + '</span><span>' + (pageNum >= 3 ? '🔒 Locked' : 'Preview') + '</span>';
                                        wrap.appendChild(header);

                                        var canvas = document.createElement('canvas');
                                        var ctx = canvas.getContext('2d');
                                        canvas.height = viewportScale.height;
                                        canvas.width = viewportScale.width;

                                        wrap.appendChild(canvas);
                                        viewport.appendChild(wrap);

                                        return page.render({ canvasContext: ctx, viewport: viewportScale }).promise;
                                    });
                                });
                            })(i);
                        }

                        renderSequence.then(function() {
                            // Attach Scroll Detection to trigger popup on Page 3
                            viewport.addEventListener('scroll', function() {
                                var page3El = document.getElementById('pdf-page-3');
                                var scrollPos = viewport.scrollTop;
                                var containerHeight = viewport.clientHeight;

                                if (page3El) {
                                    var page3Top = page3El.offsetTop;
                                    // Trigger popup when scroll reaches page 3
                                    if (scrollPos + containerHeight >= page3Top + 60) {
                                        popupOverlay.classList.add('active');
                                        if (scrollPos > page3Top) {
                                            viewport.scrollTop = page3Top; // Lock scroll at page 3
                                        }
                                    } else {
                                        popupOverlay.classList.remove('active');
                                    }
                                } else if (pdf.numPages >= 3 && (scrollPos + containerHeight >= viewport.scrollHeight - 100)) {
                                    popupOverlay.classList.add('active');
                                }
                            });
                        });
                    }).catch(function(err) {
                        console.error('PDF.js render error:', err);
                        renderIframeFallback(r);
                    });
                } else {
                    renderIframeFallback(r);
                }
            }

            function renderIframeFallback(r) {
                var viewport = document.getElementById('pdf-viewport');
                var popupOverlay = document.getElementById('popup-overlay');
                if (viewport) {
                    viewport.innerHTML = '<iframe src="' + r.pdf_path + '#page=1" style="width:100%; height:1000px; border:none;"></iframe>';
                    viewport.addEventListener('scroll', function() {
                        if (viewport.scrollTop > 400) {
                            if (popupOverlay) popupOverlay.classList.add('active');
                        }
                    });
                }
            }

            function renderNoPdfState() {
                var viewport = document.getElementById('pdf-viewport');
                var popupOverlay = document.getElementById('popup-overlay');
                if (viewport) viewport.innerHTML = '';
                if (popupOverlay) popupOverlay.classList.add('active');
            }

            function showNoReport() {
                document.getElementById('report-content').innerHTML =
                    '<div class="no-report">' +
                        '<h2><span class="gradient-text">Report Not Found</span></h2>' +
                        '<p>The report you are looking for does not exist or has been removed.</p>' +
                        '<a href="/reports" class="back-btn">Browse All Reports</a>' +
                    '</div>';
            }
        })();
    </script>
    <script type="module" src="/js/firebase-loader.js"></script>
</body>
</html>
