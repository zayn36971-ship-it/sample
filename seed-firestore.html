<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IZAN Portfolio — Firestore Data Seeder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 700px; width: 90%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px; }
        h1 { color: #00e5ff; margin-bottom: 8px; font-size: 1.5rem; }
        p.sub { color: #888; margin-bottom: 24px; font-size: 0.9rem; }
        .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #00e5ff, #7c4dff); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #log { margin-top: 24px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 16px; max-height: 400px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.82rem; line-height: 1.8; }
        .log-ok { color: #4caf50; }
        .log-err { color: #ff5252; }
        .log-info { color: #00e5ff; }
        .log-warn { color: #ffab40; }
        .progress { margin-top: 16px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00e5ff, #7c4dff); transition: width 0.3s; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Firestore Data Seeder</h1>
        <p class="sub">Seeds your Firestore database with default portfolio data (services, tools, case studies, settings). Run this once after setup.</p>
        <button class="btn" id="seed-btn" onclick="startSeed()">Seed Firestore Database</button>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="log"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASc4NeSa5EjC3cD3AlfX0jYBANp0f5-Io",
            authDomain: "portfolio-dab96.firebaseapp.com",
            projectId: "portfolio-dab96",
            storageBucket: "portfolio-dab96.firebasestorage.app",
            messagingSenderId: "573008159687",
            appId: "1:573008159687:web:f96cbec7cac3fcee156fe2",
            measurementId: "G-XJ4QWMCW3M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const logEl = document.getElementById('log');
        const progressBar = document.getElementById('progress-bar');
        let totalSteps = 0, doneSteps = 0;

        function log(msg, type = 'info') {
            logEl.innerHTML += `<div class="log-${type}">→ ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function progress() {
            doneSteps++;
            progressBar.style.width = Math.round((doneSteps / totalSteps) * 100) + '%';
        }

        // ═══════════════════════════════════════════
        // SEED DATA
        // ═══════════════════════════════════════════

        const SERVICES = [
            { title: 'Call QA Review', description: 'I review call recordings and transcripts to check call quality, caller intent, agent handling, and final call outcome.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>', key_focus: '["Clean calls", "Flagged calls", "Sales validation", "Compliance risks"]', sort_order: 1, visible: 1 },
            { title: 'Sales & Disposition Verification', description: 'I verify whether the call outcome is accurate and whether the call should be treated as sale, review, not payable, or escalated.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>', key_focus: '["Sale", "RC / NC", "Review", "Escalate"]', sort_order: 2, visible: 1 },
            { title: 'Buyer & Publisher Reporting', description: 'I create performance reports that help teams understand which buyers and publishers are performing well and which sources need attention.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>', key_focus: '["Revenue / Payout", "RPC / CPA", "Billable %", "Duplicates"]', sort_order: 3, visible: 1 },
            { title: 'Campaign Quality Monitoring', description: 'I monitor traffic quality and highlight issues that can hurt campaign performance or buyer trust.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>', key_focus: '["Incentive traffic", "Misleading ad", "Low-quality", "Wrong vertical"]', sort_order: 4, visible: 1 },
            { title: 'CRM / Call Tracker QA', description: 'I check the data side of call campaigns and identify when CRM or tracker numbers do not match.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>', key_focus: '["Missing revenue", "Cap issues", "CRM mismatch", "CSV errors"]', sort_order: 5, visible: 1 },
            { title: 'N8N Workflow Automation', description: 'I build workflows that help teams reduce manual checking and generate repeatable reports.', icon_svg: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>', key_focus: '["CSV import", "AI QA fields", "Slack reports", "Batch processing"]', sort_order: 6, visible: 1 }
        ];

        const TOOLS = [
            { name: 'n8n', category: 'Automation', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'n8n', sort_order: 1, visible: 1 },
            { name: 'OpenAI', category: 'Automation', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'AI', sort_order: 2, visible: 1 },
            { name: 'Whisper', category: 'Automation', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'W', sort_order: 3, visible: 1 },
            { name: 'Google Sheets', category: 'Reporting', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'GS', sort_order: 4, visible: 1 },
            { name: 'Excel', category: 'Reporting', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'XL', sort_order: 5, visible: 1 },
            { name: 'PDF Reports', category: 'Reporting', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'PDF', sort_order: 6, visible: 1 },
            { name: 'CSV Exports', category: 'Reporting', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'CSV', sort_order: 7, visible: 1 },
            { name: 'Slack', category: 'Communication', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'S', sort_order: 8, visible: 1 },
            { name: 'Email Updates', category: 'Communication', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: '@', sort_order: 9, visible: 1 },
            { name: 'CallGrid', category: 'Call Tracking & CRM', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'CG', sort_order: 10, visible: 1 },
            { name: 'Retreaver', category: 'Call Tracking & CRM', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'RT', sort_order: 11, visible: 1 },
            { name: 'Techaxy CRM', category: 'Call Tracking & CRM', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'TX', sort_order: 12, visible: 1 },
            { name: 'Google Drive', category: 'File & Data Management', logo_type: 'text', logo_url: '', icon_svg: '', logo_text: 'GD', sort_order: 13, visible: 1 }
        ];

        const CASE_STUDIES = [
            { title: 'Call QA Automation Workflow', problem: 'Manual call QA and reporting was taking too much time. The team needed a faster way to review call batches, identify flagged calls, and send daily summaries.', solution: 'Built a workflow using call exports, Google Sheets, n8n, AI QA logic, and Slack reporting.', workflow: 'CSV Export, Google Sheets, AI QA, QA Result, Slack Summary', result: 'Faster daily QA processing, Better visibility on flagged calls, Clearer daily summaries, Less manual reporting work', button_text: 'VIEW WORKFLOW', button_url: '#', sort_order: 1, visible: 1, screenshots: '' },
            { title: 'Buyer & Publisher CPA Reporting', problem: 'Discrepancies in call counts and billable duration between buyer side and publisher side caused tracking friction and delayed billing reconciliations.', solution: 'Created structured daily CPA breakdown sheets with automatic RPC, CPC, and margin alerts.', workflow: 'Raw Exports, Data Cleaning, Revenue Match, CPA Calculator, Alert Trigger', result: 'Eliminated billing disputes, Faster weekly publisher payouts, Clear insight into top performing routes, Zero undetected zero-sale buyers', button_text: 'VIEW REPORT METHOD', button_url: '#', sort_order: 2, visible: 1, screenshots: '' },
            { title: 'CRM & Tracker Discrepancy Analysis', problem: "Calls recorded in CallGrid didn't match billable records in CRM due to cap limits, caller ID mismatches, and improper route rules.", solution: 'Implemented a cross-verification protocol comparing CSV call logs line-by-line against CRM status.', workflow: 'Call Logs, Tracker Check, CRM Map, Discrepancy Log, Fix Action', result: 'Detected reporting gaps faster, Identified tracking issues early, Resolved campaign setup problems, Improved data accuracy', button_text: 'VIEW ISSUE EXAMPLE', button_url: '#', sort_order: 3, visible: 1, screenshots: '' }
        ];

        const SETTINGS = {
            'site_title': 'IZAN Portfolio',
            'contact_email': 'contact@example.com',
            'meta_title': 'IZAN | Call QA & Technical Operations Specialist',
            'meta_description': 'Portfolio of Izaan Shakil — Call QA & Automation Specialist for Pay-Per-Call Campaigns',
            'booking_url': '',
            'social_github': '',
            'social_linkedin': '',
            'social_facebook': '',
            'social_whatsapp': '',
            'hero_headline': 'Call QA & Automation Specialist for Pay-Per-Call Campaigns',
            'hero_subtitle': 'I help teams review calls, verify sales/dispositions, find compliance issues, monitor buyer and publisher performance, and automate QA reporting using tools like n8n, Google Sheets, Slack, CallGrid, Retreaver, and CRM systems.',
            'hero_btn1_text': 'View Reports',
            'hero_btn1_link': '/reports',
            'hero_btn2_text': 'Schedule a Meeting',
            'hero_btn2_link': '#contact',
            'hero_btn3_text': 'View CV',
            'hero_btn3_link': '/cv/view',
            'hero_profile_img': '/izaan.jfif',
            'hero_bg_img': '',
            'hero_bg_opacity': '40',
            'hero_video_url': ''
        };

        // ═══════════════════════════════════════════
        // SEED FUNCTIONS
        // ═══════════════════════════════════════════

        async function seedCollection(name, items) {
            const batch = writeBatch(db);
            items.forEach((item, idx) => {
                const ref = doc(collection(db, name));
                batch.set(ref, item);
            });
            await batch.commit();
            log(`✓ Seeded ${items.length} documents into "${name}"`, 'ok');
            progress();
        }

        async function seedSettings() {
            const batch = writeBatch(db);
            Object.entries(SETTINGS).forEach(([key, value]) => {
                const ref = doc(db, 'settings', key);
                batch.set(ref, { value });
            });
            await batch.commit();
            log(`✓ Seeded ${Object.keys(SETTINGS).length} settings`, 'ok');
            progress();
        }

        async function seedCV() {
            await setDoc(doc(db, 'cv', 'current'), {
                title: 'Izaan Shakil CV',
                description: 'Call QA & Automation Specialist',
                pdf_path: '/uploads/cv/1784841308562-674707206.pdf',
                show_button: 1,
                last_updated: new Date().toISOString()
            });
            log('✓ Seeded CV document', 'ok');
            progress();
        }

        // ═══════════════════════════════════════════
        // MAIN
        // ═══════════════════════════════════════════

        window.startSeed = async function() {
            const btn = document.getElementById('seed-btn');
            btn.disabled = true;
            btn.textContent = 'Seeding...';
            logEl.innerHTML = '';
            totalSteps = 6;
            doneSteps = 0;
            progressBar.style.width = '0%';

            try {
                log('Starting Firestore seed...', 'info');

                // Check if data already exists
                const existing = await getDocs(collection(db, 'services'));
                if (existing.docs.length > 0) {
                    log('⚠ Services collection already has data (' + existing.docs.length + ' docs). Skipping services seed to avoid duplicates.', 'warn');
                    progress();
                } else {
                    await seedCollection('services', SERVICES);
                }

                const existingTools = await getDocs(collection(db, 'tools'));
                if (existingTools.docs.length > 0) {
                    log('⚠ Tools collection already has data. Skipping.', 'warn');
                    progress();
                } else {
                    await seedCollection('tools', TOOLS);
                }

                const existingCases = await getDocs(collection(db, 'case_studies'));
                if (existingCases.docs.length > 0) {
                    log('⚠ Case studies already has data. Skipping.', 'warn');
                    progress();
                } else {
                    await seedCollection('case_studies', CASE_STUDIES);
                }

                await seedSettings();
                log('  (Settings are always overwritten to ensure defaults exist)', 'info');

                await seedCV();

                progress(); // final step

                log('', 'info');
                log('═══════════════════════════════════════', 'ok');
                log('✅ SEED COMPLETE! Your Firestore database is ready.', 'ok');
                log('═══════════════════════════════════════', 'ok');
                log('', 'info');
                log('Next steps:', 'info');
                log('1. Set up Firebase Auth: Go to Firebase Console → Authentication → Add user', 'info');
                log('2. Deploy to Vercel: Push to GitHub and import into Vercel', 'info');

                btn.textContent = '✓ Seed Complete';

            } catch (err) {
                log('✗ Error: ' + err.message, 'err');
                console.error(err);
                btn.disabled = false;
                btn.textContent = 'Retry Seed';
            }
        };
    </script>
</body>
</html>
